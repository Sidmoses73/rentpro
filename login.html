        }

        }

        .error-message {

            color: #c53030;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            border-left: 4px solid #f56565;
            animation: shake 0.5s ease-in-out;
            word-break: break-word;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {

            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;

        .form-control {

            padding: 16px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #f8fafc;
            -webkit-appearance: none;

        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            background-color: white;
        }

        .form-control:hover {

            background-color: white;

        .form-control::placeholder {

        /* Remove number input spinners */
        .form-control[type=number]::-webkit-inner-spin-button,
        .form-control[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn-login {

    <!-- JavaScript for better mobile experience -->
    <script>
        (function() {
            // Prevent zoom on input focus for iOS
            if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                const viewport = document.querySelector('meta[name=viewport]');
                if (viewport) {
                    viewport.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes';
                }
            }
            
            // Add active class to buttons for better touch feedback
            const buttons = document.querySelectorAll('.btn-login, .login-footer a, .back-home a');
            buttons.forEach(button => {
                button.addEventListener('touchstart', function() {
                    this.style.opacity = '0.8';
                }, { passive: true });
                
                button.addEventListener('touchend', function() {
                    this.style.opacity = '1';
                });
                
                button.addEventListener('touchcancel', function() {
                    this.style.opacity = '1';
                });
            });
            
            // Auto-dismiss error message on input
            const errorMsg = document.querySelector('.error-message');
            if (errorMsg) {
                const inputs = document.querySelectorAll('.form-control');
                inputs.forEach(input => {
                    input.addEventListener('input', function() {
                        errorMsg.style.display = 'none';
                    }, { once: true });
                });
            }

            // Add smooth scrolling for back button (optional)
            const backButton = document.querySelector('.back-home a');
            if (backButton) {
                backButton.addEventListener('click', function(e) {
                    // You can add any analytics tracking here if needed
                    console.log('Back to home clicked');
                });
            }

            // Prevent form resubmission on page refresh
            if (window.history.replaceState) {
                window.history.replaceState(null, null, window.location.href);
            }
        })();
    </script>
